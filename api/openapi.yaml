openapi: 3.1.0
info:
  title: Tabverse sync API
  version: 0.1.0
  description: |
    Contract for `tabversed`, the Tabverse sync server.

    ## Authentication
    All endpoints except `/healthz`, `POST /api/v1/auth/bootstrap`,
    `POST /api/v1/auth/pair` and `GET /api/v1/admin/config` require
    `Authorization: Bearer <token>`. A device token and the *admin* token are
    different credentials, and neither is accepted where the other belongs.

    ## Accounts
    Without `TABVERSED_ADMIN_TOKEN` the deployment is single tenant:
    `POST /api/v1/auth/bootstrap` is open only while it holds no account, and
    that account owns everything afterwards. With the admin token set, an
    operator provisions any number of accounts through `/api/v1/admin/users`,
    each isolated by `user_id` exactly as the devices of one account already
    were, and `POST /api/v1/auth/bootstrap` requires the admin token too.

    ## Revisions
    The server keeps a per-user monotonic revision counter (`rev_seq`). Every
    accepted record write assigns the next value as the record's `rev`.
    Clients persist the highest revision they have seen and download deltas
    with `GET /api/v1/sync?since=<rev>`.

    ## Conflict resolution
    Last-writer-wins on the client supplied `updated_at` (unix milliseconds).
    Losing writes come back with `status: "stale"` and the winning server copy
    attached as `current`.

    ## Realtime stream (WebSocket)
    `GET /api/v1/sync/stream` upgrades to a WebSocket (token may be passed as
    `?access_token=` because browsers cannot set handshake headers).
    Server -> client frames:

    ```json
    {"type":"hello","rev":12,"server_at":1760000000000}
    {"type":"records_changed","rev":13,"entities":["note"],"server_at":1760000000001}
    ```
  license:
    name: MIT

servers:
  - url: http://localhost:8223

tags:
  - name: auth
  - name: sync
  - name: search
  - name: admin
    description: |
      Operator surface behind the web console (`GET /`), see ADR 0009. Gated
      by `TABVERSED_ADMIN_TOKEN`; every route answers `404` while it is unset.
      Read only over user data by design.

paths:
  /healthz:
    get:
      tags: [auth]
      summary: Liveness probe (unauthenticated)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /api/v1/auth/bootstrap:
    post:
      tags: [auth]
      summary: Create the first account of a deployment
      description: |
        Only succeeds while the server has zero users; afterwards it returns
        409 and the deployment must be paired with an invite code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: default }
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentials' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/pair:
    post:
      tags: [auth]
      summary: Redeem a single use pairing code for a device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string, examples: ['BSKT-VT6V-7SX3-XVCQ'] }
                device_name: { type: string }
      responses:
        '201':
          description: device registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/invites:
    post:
      tags: [auth]
      summary: Mint a pairing code for another device of this account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  { type: integer, minimum: 60, maximum: 86400, default: 900 }
      responses:
        '201':
          description: code created (single use)
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { type: string, examples: ['BSKT-VT6V-7SX3-XVCQ'] }
                  expires_at: { type: integer, description: unix ms }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sync:
    get:
      tags: [sync]
      summary: Delta download of records changed since a revision
      parameters:
        - {
            name: since,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: records ordered by revision
          content:
            application/json:
              schema:
                type: object
                required: [records, next_rev, has_more, server_rev]
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  next_rev:
                    { type: integer, description: pass as `since` next time }
                  has_more: { type: boolean }
                  server_rev: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sync]
      summary: Batch upload of records (LWW per record)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: per record outcome
          content:
            application/json:
              schema:
                type: object
                required: [results, server_rev]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/RecordResult' }
                  server_rev: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /api/v1/entities/{entity}/{id}:
    parameters:
      - { $ref: '#/components/parameters/entity' }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [sync]
      summary: Fetch one record (tombstones included)
      responses:
        '200':
          description: the record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sync]
      summary: Soft delete (creates a tombstone propagated by delta sync)
      responses:
        '200': { $ref: '#/components/responses/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/search:
    get:
      tags: [search]
      summary: Full text search over this account's records
      description: |
        Every term is matched, not just one of them, and the last term is
        matched as a prefix so the extension can search while the user types.

        Hits come back ranked, and each one names the **tabverse** it belongs
        to (`tabspace_id`), because that is the unit the extension lists: a
        match on one tab, note or closed tab means "this tabverse matched".
        The client drops the tabverses it has not downloaded, so a hit for a
        tabverse this device has never synced is expected and harmless.

        `allnote` / `alltodo` / `allbookmark` are never indexed (they are id
        lists) and `session` only exists for pre-ADR-0006 clients.
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string },
            description: 'free text; last term is matched as a prefix',
          }
        - {
            name: entity,
            in: query,
            schema: { $ref: '#/components/schemas/Entity' },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: object
                required: [query, hits]
                properties:
                  query: { type: string }
                  hits:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sync/stream:
    get:
      tags: [sync]
      summary: Realtime change notifications (WebSocket upgrade)
      description: |
        Authenticate with the `Authorization` header or `?access_token=`.
        See the top level description for the frame format.
      parameters:
        - { name: access_token, in: query, schema: { type: string } }
      responses:
        '101': { description: switching protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/config:
    get:
      tags: [admin]
      security: []
      summary: What this deployment allows (unauthenticated)
      description: |
        Lets the console explain itself before it asks for a token, so an
        operator staring at a login form knows whether the admin API is simply
        not configured.
      responses:
        '200':
          description: deployment capabilities
          content:
            application/json:
              schema:
                type: object
                required: [admin_enabled, version]
                properties:
                  admin_enabled: { type: boolean }
                  version: { type: string }

  /api/v1/admin/totals:
    get:
      tags: [admin]
      summary: Deployment wide counters (the console header)
      responses:
        '200':
          description: totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Totals' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List accounts with their counters
      responses:
        '200':
          description: accounts
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
    post:
      tags: [admin]
      summary: Create an account
      description: |
        This is what makes a deployment multi tenant. Pass `device_name` to
        also issue that device's token right away (the console's "create and
        pair in one go" path); like every token, it is returned only once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                device_name: { type: string }
      responses:
        '201':
          description: the account, or its credentials when device_name was given
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /api/v1/admin/users/{user_id}:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: One account with its stats, devices and tokens
      responses:
        '200':
          description: account detail (user, stats, devices, tokens)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      summary: Rename an account (its data is untouched)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '204': { description: renamed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete an account and everything it stored
      description: |
        Records, devices, tokens, invites and the account's search index rows
        all go. There is no trash; the console asks for a typed confirmation.
      responses:
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/invites:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    post:
      tags: [admin]
      summary: Mint a pairing code for this account
      description: |
        Lets an operator add a device to an account they did not create. The
        code is single use and short lived; `POST /api/v1/auth/pair` exchanges
        it for a device token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, minimum: 60, maximum: 86400 }
      responses:
        '201':
          description: the code, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  code: { type: string }
                  expires_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/devices/{device_id}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      summary: Revoke every live token of one device
      responses:
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tokens/{hash}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - name: hash
        in: path
        required: true
        schema: { type: string }
        description: the stored hash from the account's token listing
    delete:
      tags: [admin]
      summary: Revoke one device token
      description: |
        Tokens are stored only as a SHA-256 hash, so the console can show a
        token by fingerprint and revoke it by hash, but never display it again.
      responses:
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tokens/{hash}/archive:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: hash, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Archive a revoked token
      description: |
        Hides the token from the console's default lists. Requires it to be
        revoked first: archiving is tidying, revoking is how access is cut.
        The token stays revoked, and it stays in use or not exactly as it was
        (ADR 0011).
      responses:
        '200': { description: archived, or a no-op if it already was }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: the token is not revoked yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [admin]
      summary: Unarchive a token (it stays revoked)
      responses:
        '200': { description: unarchived }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/devices/{device_id}/archive:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Archive a revoked, abandoned device
      description: |
        Requires no usable token left on the device **and** no successful
        authentication for `TABVERSED_DEVICE_INACTIVE_DAYS` (default 30). A
        device that never authenticated is exempt, so a mis-issued pairing code
        revoked straight away can be tidied immediately. Hides the device from
        the console's default lists; it stays stored (ADR 0011).
      responses:
        '200': { description: archived, or a no-op if it already was }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: still usable, or not silent for long enough
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [admin]
      summary: Unarchive a device (its tokens stay revoked)
      responses:
        '200': { description: unarchived }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/devices/{device_id}/records/archive:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Archive the records this device last wrote
      description: |
        The same preconditions as archiving the device. The records stay
        stored and keep syncing to the user's own devices, and the extension's
        search is not filtered - only this console's views are. A record edited
        again un-archives itself. Tombstones are left alone.
      responses:
        '200':
          description: how many records were archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: still usable, or not silent for long enough
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [admin]
      summary: Unarchive the records this device wrote
      responses:
        '200':
          description: how many records were restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tabspaces:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: The account's tabverses, newest first
      description: |
        Read only. Each row is one `tabspace` record plus the child counts the
        console's card shows, resolved server side. Archived tabverses are
        hidden unless `archived=1` (ADR 0011).
      parameters:
        - { name: q, in: query, schema: { type: string }, description: literal substring of the payload }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: archived, in: query, schema: { type: string, enum: ['0', '1'] }, description: include archived rows }
      responses:
        '200':
          description: tabverse list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tabspaces:
                    type: array
                    items: { $ref: '#/components/schemas/TabspaceSummary' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tabspaces/{tabspace_id}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: tabspace_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: One tabverse with its tabs, notes, todos, bookmarks and history
      description: |
        The read only equivalent of the extension's tabverse view. The order is
        the client's: tabs follow the tabverse's own `tabIds`, the rest follow
        the `allnote` / `alltodo` / `allbookmark` aggregates, and closed tabs
        follow their own `closedAt`, newest first. Rows no list mentions are
        still returned, after the listed ones.
      responses:
        '200':
          description: the tabverse bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TabspaceBundle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/records:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: Raw record browser
      description: |
        The escape hatch for a record the rendered views cannot make sense of:
        any entity, optionally one tabverse, with a literal substring search
        over the payload (`%` is not a wildcard) and tombstones hidden by
        default.
      parameters:
        - { name: entity, in: query, schema: { $ref: '#/components/schemas/Entity' } }
        - { name: tabspace_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: deleted, in: query, schema: { type: string, enum: ['0', '1'] } }
        - { name: archived, in: query, schema: { type: string, enum: ['0', '1'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: a page of records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/search:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: Full text search over one account, with display titles
      description: |
        The same FTS index the extension queries, scoped to one account, with
        the record's title filled in so hits can be listed. An empty `q` is an
        empty result, not "everything". Archived records are hidden unless
        `archived=1`, so this view agrees with the listings beside it; the
        extension's own search never filters them (ADR 0011).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: entity, in: query, schema: { $ref: '#/components/schemas/Entity' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: archived, in: query, schema: { type: string, enum: ['0', '1'] } }
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  hits:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSearchHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    entity:
      name: entity
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Entity' }
    userId:
      name: user_id
      in: path
      required: true
      schema: { type: string }
      description: the account the admin acts on

  schemas:
    Entity:
      type: string
      description: >-
        `session` is deprecated: the extension stopped recording browser
        session snapshots (ADR 0006) and no current client sends it. The server
        still accepts and prunes it for older builds.
      enum:
        [
          tabspace,
          tab,
          session,
          note,
          todo,
          bookmark,
          closedtab,
          allnote,
          alltodo,
          allbookmark,
        ]

    RecordInput:
      type: object
      required: [entity, id, updated_at]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        id: { type: string, maxLength: 128 }
        updated_at:
          type: integer
          description: client assigned modification time (unix ms), used for LWW
        deleted: { type: boolean, default: false }
        payload:
          type: string
          maxLength: 1048576
          description: JSON document shape of the entity

    Record:
      allOf:
        - $ref: '#/components/schemas/RecordInput'
        - type: object
          required: [rev, server_at]
          properties:
            rev: { type: integer, description: server assigned revision }
            server_at:
              {
                type: integer,
                description: when the server accepted it (unix ms),
              }
            device_id: { type: string }

    RecordResult:
      type: object
      required: [entity, id, status, rev, updated_at]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        id: { type: string }
        status: { type: string, enum: [ok, stale] }
        rev: { type: integer }
        updated_at: { type: integer }
        current:
          allOf: [{ $ref: '#/components/schemas/Record' }]
          description: present when status=stale, the winning server copy

    DeviceCredentials:
      type: object
      required: [user_id, device_id, token, server_rev]
      properties:
        user_id: { type: string }
        device_id: { type: string }
        token: { type: string, description: store this, shown only once }
        server_rev: { type: integer }
        issued_at: { type: integer }

    SearchHit:
      type: object
      required: [entity, id, score]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        id: { type: string, description: the id of the record that matched }
        score: { type: number, description: higher is better }
        snippet:
          type: string
          description: >-
            highlighted excerpt, `[term]` marked. Identifier fields (ids,
            tabSpaceId, the aggregate id lists) are not indexed, so they never
            appear here.
        tabspace_id:
          type: string
          description: >-
            the tabverse this record belongs to; for a `tabspace` hit it is the
            record's own id. Absent only for a malformed record payload.
          example: ts-1a2b3c

    ArchiveOutcome:
      type: object
      description: what an archive or unarchive changed
      required: [archived, unarchived, skipped]
      properties:
        archived: { type: integer, description: rows hidden from the default views }
        unarchived: { type: integer }
        skipped:
          type: integer
          description: rows already in the requested state, so a repeated call is a visible no-op

    UserSummary:
      type: object
      required: [id, name, created_at, rev_seq, device_count, token_count, record_count]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        rev_seq: { type: integer, description: the account's current revision tip }
        device_count: { type: integer }
        token_count: { type: integer, description: tokens that are not revoked }
        revoked_token_count: { type: integer }
        record_count: { type: integer, description: live records, tombstones excluded }
        last_activity:
          type: integer
          description: newest updated_at among live records, 0 if never synced

    TokenInfo:
      type: object
      required: [hash, fingerprint, device_id, created_at, revoked]
      properties:
        hash: { type: string, description: the stored hash; pass it to revoke this token }
        fingerprint: { type: string, description: first 8 characters, for display }
        device_id: { type: string }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
        revoked: { type: boolean }
        last_used: { type: integer, description: unix ms of the last authenticated request, 0 if never }
        archived_at: { type: integer, description: 0 when not archived (ADR 0011) }
        archived: { type: boolean }

    DeviceInfo:
      type: object
      required: [id, name, created_at, active_tokens]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        active_tokens: { type: integer }
        last_used: { type: integer }
        archived_at: { type: integer, description: 0 when not archived (ADR 0011) }
        archived: { type: boolean }
        archived_records: { type: integer, description: live records this device wrote that are archived }

    TabspaceSummary:
      type: object
      required: [id, name, updated_at, rev, tab_count]
      properties:
        id: { type: string }
        name:
          type: string
          description: "(untitled) when the stored payload has no name"
        created_at: { type: integer }
        updated_at: { type: integer }
        rev: { type: integer }
        tab_count: { type: integer, description: "len(tabIds) of the stored payload" }
        groups: { type: integer, description: tab groups the tabverse remembers }
        notes: { type: integer }
        todos: { type: integer }
        bookmarks: { type: integer }
        closed_tabs: { type: integer }

    BundleRow:
      type: object
      required: [id, rev, updated_at, position, data]
      properties:
        id: { type: string }
        rev: { type: integer }
        updated_at: { type: integer }
        server_at: { type: integer }
        position: { type: integer, description: index in the client's own ordering }
        data: { type: object, description: the record payload, decoded }

    TabspaceBundle:
      type: object
      required: [tabspace, tabs, notes, todos, bookmarks, closed_tabs, aggregates]
      properties:
        tabspace: { $ref: '#/components/schemas/TabspaceSummary' }
        tabspace_data:
          type: object
          description: the tabverse's own payload, decoded (tab groups live here)
        tabs:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        todos:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        bookmarks:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        closed_tabs:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        aggregates:
          type: object
          description: the raw allnote / alltodo / allbookmark payloads
          additionalProperties: { type: string }

    AdminSearchHit:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            title: { type: string, description: the record's display title, for listing }
            url: { type: string }

    Totals:
      type: object
      required: [users, devices, active_tokens, live_records, tombstones]
      properties:
        users: { type: integer }
        devices: { type: integer }
        active_tokens: { type: integer }
        live_records: { type: integer }
        tombstones: { type: integer }
        archived_devices: { type: integer }
        archived_tokens: { type: integer }
        archived_records:
          type: integer
          description: still counted in live_records; archiving hides a row from the console, it does not unstore it
        by_entity:
          type: object
          additionalProperties: { type: integer }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing or invalid token / invite code
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: account already bootstrapped
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: unknown entity, record or account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminDisabled:
      description: TABVERSED_ADMIN_TOKEN is not set, so the admin API does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: batch or payload too large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SyncResult:
      description: sync outcome
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items: { $ref: '#/components/schemas/RecordResult' }
              server_rev: { type: integer }

security:
  - bearerToken: []
