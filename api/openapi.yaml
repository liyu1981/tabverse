openapi: 3.1.0
info:
  title: Tabverse sync API
  version: 0.1.0
  description: |
    Contract for `tabversed`, the Tabverse sync server.

    ## Authentication
    Two credentials, and they are not interchangeable.

    * **The extension** sends `Authorization: Bearer <device token>` on
      `/api/v1/sync`, `/api/v1/entities/*` and `/api/v1/search`. It pairs
      (`POST /api/v1/auth/pair`) and never signs in: no password, no session,
      no cookie (ADR 0002).
    * **The console** (`/api/v1/admin/*`, `/api/v1/console/*`) uses the session
      cookie set by the auth library, plus an `X-XSRF-Token` header on every
      state changing request. A device token is refused there (ADR 0013).

    ## Console sessions
    A console sign-in lasts `TABVERSED_SESSION_TTL` (default `24h`) and then
    ends: the server refuses the token's expiry rather than letting the auth
    library renew it, and clears the cookie. `0` disables the bound.
    `POST /api/v1/console/revoke-sessions` ends every session of the calling
    account by moving its revocation cut-off, and the operator's
    `PUT /api/v1/admin/users/{user_id}/revoke-sessions` does the same for
    somebody else. Neither touches the extension's device tokens, which are a
    different credential with no expiry (ADR 0021).

    ## Accounts
    Accounts are always on; there is no master credential. People register with
    a single-use email link (or a configured social provider) and manage their
    own account; the first registration with `TABVERSED_ADMIN_EMAIL` becomes the
    operator, and an operator may name others. `POST /api/v1/auth/bootstrap` is
    refused as soon as the deployment has a user or an account.

    ## Revisions
    The server keeps a per-user monotonic revision counter (`rev_seq`). Every
    accepted record write assigns the next value as the record's `rev`.
    Clients persist the highest revision they have seen and download deltas
    with `GET /api/v1/sync?since=<rev>`.

    ## Conflict resolution
    Last-writer-wins on the client supplied `updated_at` (unix milliseconds).
    Losing writes come back with `status: "stale"` and the winning server copy
    attached as `current`.

    ## Realtime stream (WebSocket)
    `GET /api/v1/sync/stream` upgrades to a WebSocket (token may be passed as
    `?access_token=` because browsers cannot set handshake headers).
    Server -> client frames:

    ```json
    {"type":"hello","rev":12,"server_at":1760000000000}
    {"type":"records_changed","rev":13,"entities":["note"],"server_at":1760000000001}
    ```
  license:
    name: MIT

servers:
  - url: http://localhost:8223

tags:
  - name: auth
  - name: sync
  - name: search
  - name: console
    description: |
      Session-scoped endpoints the web console (`GET /`) calls - a signed-in
      account acting on its own account, never a device token (see
      `securitySchemes`).
  - name: admin
    description: |
      Operator surface behind the web console (`GET /`), see ADR 0009. Gated
      by `TABVERSED_ADMIN_TOKEN`; every route answers `404` while it is unset.
      Read only over user data by design.

paths:
  /healthz:
    get:
      tags: [auth]
      summary: Liveness probe (unauthenticated)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /api/v1/auth/bootstrap:
    post:
      tags: [auth]
      summary: Create the first account of a deployment
      description: |
        Only succeeds while the server has zero users; afterwards it returns
        409 and the deployment must be paired with an invite code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: default }
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentials' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/pair:
    post:
      tags: [auth]
      summary: Redeem a single use pairing code for a device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string, examples: ['BSKT-VT6V-7SX3-XVCQ'] }
                device_name: { type: string }
      responses:
        '201':
          description: device registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/invites:
    post:
      tags: [auth]
      summary: Mint a pairing code for another device of this account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  { type: integer, minimum: 60, maximum: 86400, default: 900 }
      responses:
        '201':
          description: code created (single use)
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { type: string, examples: ['BSKT-VT6V-7SX3-XVCQ'] }
                  expires_at: { type: integer, description: unix ms }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/console/pair:
    post:
      tags: [console]
      summary: Mint a device and its token for the signed-in account
      description: |
        The official-server pairing wizard (adr/0020). The extension opens the
        console in a window with its own id and a nonce in the URL; the person
        signs in there, names the device and approves it; this endpoint creates
        the device and its token **for the session's account**, and the page
        hands the token to the extension over `chrome.runtime.sendMessage` (the
        extension's `externally_connectable` channel), never rendering it.

        Security: the console session cookie and its XSRF header, not a device
        token. There is **no account parameter**: the account is the session's,
        so a page that could name one would be the invite endpoint with extra
        steps. An assumed identity (impersonation) is refused, as on every other
        mutating console route - a token issued under one would outlive it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  { type: string, examples: ['Chrome on Windows'] }
                extension_id:
                  type: string
                  description: >-
                    the extension that asked, recorded on the device row so the
                    account's device list says which browser paired it
      responses:
        '201':
          description: device + token, returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentials' }
        '401':
          description: no session, or the session does not resolve to an account
          content:
            application/json:
              schema: { type: object }
        '403':
          description: read only - the caller is impersonating an account
          content:
            application/json:
              schema: { type: object }

  /api/v1/console/revoke-sessions:
    post:
      tags: [console]
      summary: End every console session on this account
      description: |
        "Sign out everywhere" (adr/0021): moves the account's revocation
        cut-off, so every session it ever issued - including this browser's,
        which is why the response also clears the cookie - has to sign in
        again. Audited as `sessions_revoked`.

        **The extension's device tokens are not touched.** They are a different
        credential with no expiry, and revoking them would silently stop
        somebody's devices syncing; unpair them from the devices endpoints
        instead. A cut-off is compared at second granularity, so a session
        minted in the same second survives it.
      responses:
        '204': { description: every session of this account is now refused }
        '401':
          description: no session, or the session does not resolve to an account
          content:
            application/json:
              schema: { type: object }
        '403':
          description: read only - the caller is impersonating an account
          content:
            application/json:
              schema: { type: object }

  /api/v1/sync:
    get:
      tags: [sync]
      summary: Delta download of records changed since a revision
      parameters:
        - {
            name: since,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: records ordered by revision
          content:
            application/json:
              schema:
                type: object
                required: [records, next_rev, has_more, server_rev]
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  next_rev:
                    { type: integer, description: pass as `since` next time }
                  has_more: { type: boolean }
                  server_rev: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sync]
      summary: Batch upload of records (LWW per record)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: per record outcome
          content:
            application/json:
              schema:
                type: object
                required: [results, server_rev]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/RecordResult' }
                  server_rev: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /api/v1/entities/{entity}/{id}:
    parameters:
      - { $ref: '#/components/parameters/entity' }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [sync]
      summary: Fetch one record (tombstones included)
      responses:
        '200':
          description: the record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sync]
      summary: Soft delete (creates a tombstone propagated by delta sync)
      responses:
        '200': { $ref: '#/components/responses/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/search:
    get:
      tags: [search]
      summary: Full text search over this account's records
      description: |
        Every term is matched, not just one of them, and the last term is
        matched as a prefix so the extension can search while the user types.

        Hits come back ranked, and each one names the **tabverse** it belongs
        to (`tabspace_id`), because that is the unit the extension lists: a
        match on one tab, note or closed tab means "this tabverse matched".
        The client drops the tabverses it has not downloaded, so a hit for a
        tabverse this device has never synced is expected and harmless.

        `allnote` / `alltodo` / `allbookmark` are never indexed (they are id
        lists) and `session` only exists for pre-ADR-0006 clients.
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string },
            description: 'free text; last term is matched as a prefix',
          }
        - {
            name: entity,
            in: query,
            schema: { $ref: '#/components/schemas/Entity' },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: object
                required: [query, hits]
                properties:
                  query: { type: string }
                  hits:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sync/stream:
    get:
      tags: [sync]
      summary: Realtime change notifications (WebSocket upgrade)
      description: |
        Authenticate with the `Authorization` header or `?access_token=`.
        See the top level description for the frame format.
      parameters:
        - { name: access_token, in: query, schema: { type: string } }
      responses:
        '101': { description: switching protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/config:
    get:
      tags: [admin]
      security: []
      summary: What this deployment allows (unauthenticated)
      description: |
        Lets the console explain itself before it asks for a token, so an
        operator staring at a login form knows whether the admin API is simply
        not configured.
      responses:
        '200':
          description: deployment capabilities
          content:
            application/json:
              schema:
                type: object
                required: [admin_enabled, version]
                properties:
                  admin_enabled: { type: boolean }
                  version: { type: string }

  /api/v1/admin/totals:
    get:
      tags: [admin]
      summary: Deployment wide counters (the console header)
      responses:
        '200':
          description: totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Totals' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: "The operator's directory: every account, with its counters"
      description: |
        Operator-only. A person signing in sees their own account and nothing
        else, which is why this is a forbidden view for them. The address and
        the role are here because without them a row is an opaque id (ADR
        0014).
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: substring of the name or the email address
          }
      responses:
        '200':
          description: accounts
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
  # There is no POST /api/v1/admin/users: registration is the only way an
  # account is created (ADR 0014), so there is exactly one path that can prove
  # an address.

  /api/v1/admin/users/{user_id}:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: One account with its stats, devices and tokens
      responses:
        '200':
          description: account detail (user, stats, devices, tokens)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      summary: Rename an account (its data is untouched)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '204': { description: renamed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete an account and everything it stored
      description: |
        Records, devices, tokens, invites and the account's search index rows
        all go. There is no trash; the console asks for a typed confirmation.
      responses:
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/invites:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    post:
      tags: [admin]
      summary: Mint a pairing code for this account
      description: |
        Lets an operator add a device to an account they did not create. The
        code is single use and short lived; `POST /api/v1/auth/pair` exchanges
        it for a device token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, minimum: 60, maximum: 86400 }
      responses:
        '201':
          description: the code, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  code: { type: string }
                  expires_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/devices/{device_id}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      summary: Revoke every live token of one device
      responses:
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tokens/{hash}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - name: hash
        in: path
        required: true
        schema: { type: string }
        description: the stored hash from the account's token listing
    delete:
      tags: [admin]
      summary: Revoke one device token
      description: |
        Tokens are stored only as a SHA-256 hash, so the console can show a
        token by fingerprint and revoke it by hash, but never display it again.
      responses:
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/revoke-sessions:
    parameters:
      - { $ref: '#/components/parameters/userId' }
    put:
      tags: [admin]
      summary: End every console session on this account (operator's move)
      description: |
        The operator's "sign out everywhere", for the case where the account to
        fix is not the one at the keyboard (adr/0021). Moves the account's
        revocation cut-off and audits `sessions_revoked` against both the actor
        and the account. Device tokens are untouched - see
        `POST /api/v1/console/revoke-sessions`.
      responses:
        '204': { description: every session of this account is now refused }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tokens/{hash}/archive:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: hash, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Archive a revoked token
      description: |
        Hides the token from the console's default lists. Requires it to be
        revoked first: archiving is tidying, revoking is how access is cut.
        The token stays revoked, and it stays in use or not exactly as it was
        (ADR 0011).
      responses:
        '200': { description: archived, or a no-op if it already was }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: the token is not revoked yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [admin]
      summary: Unarchive a token (it stays revoked)
      responses:
        '200': { description: unarchived }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/devices/{device_id}/archive:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Archive a device (revoke and archive its tokens, then archive it)
      description: |
        One deterministic teardown: every token the device holds is revoked,
        those tokens are archived, and the device is archived, in a single
        transaction. Immediate - there is no inactivity window to wait out and
        no need to revoke first. Hides the rows from the console's default
        lists; they stay stored and their records keep syncing (ADR 0011).
      responses:
        '200': { description: archived, or a no-op if it already was }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Unarchive a device (its tokens stay revoked)
      responses:
        '200': { description: unarchived }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/devices/{device_id}/records/archive:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Archive the records this device last wrote
      description: |
        Requires the device to have no usable token left, which archiving the
        device satisfies. The records stay stored and keep syncing to the
        user's own devices, and the extension's search is not filtered - only
        this console's views are. A record edited again un-archives itself.
        Tombstones are left alone.
      responses:
        '200':
          description: how many records were archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: still usable (revoke it first, or archive the device)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [admin]
      summary: Unarchive the records this device wrote
      responses:
        '200':
          description: how many records were restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tabspaces:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: The account's tabverses, newest first
      description: |
        Read only. Each row is one `tabspace` record plus the child counts the
        console's card shows, resolved server side. Archived tabverses are
        hidden unless `archived=1` (ADR 0011).
      parameters:
        - { name: q, in: query, schema: { type: string }, description: literal substring of the payload }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: archived, in: query, schema: { type: string, enum: ['0', '1'] }, description: include archived rows }
      responses:
        '200':
          description: tabverse list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tabspaces:
                    type: array
                    items: { $ref: '#/components/schemas/TabspaceSummary' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/tabspaces/{tabspace_id}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
      - { name: tabspace_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: One tabverse with its tabs, notes, todos, bookmarks and history
      description: |
        The read only equivalent of the extension's tabverse view. The order is
        the client's: tabs follow the tabverse's own `tabIds`, the rest follow
        the `allnote` / `alltodo` / `allbookmark` aggregates, and closed tabs
        follow their own `closedAt`, newest first. Rows no list mentions are
        still returned, after the listed ones.
      responses:
        '200':
          description: the tabverse bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TabspaceBundle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete one tabverse and everything in it
      description: |
        The only write over user data in the admin API (ADR 0015). It is a
        delete and not an edit: every record of the tabverse - its tabs, notes,
        todos, bookmarks, closed tabs and the three ordered aggregates - is
        tombstoned, so the user's paired devices delete their own copies
        through the normal delta sync instead of pushing the rows straight
        back. Removing the rows from SQLite instead would leave every device
        holding a copy that comes back on its next push.

        `confirm` must carry the tabverse id: the console asks for a typed
        confirmation, because a mis-clicked button one row away from the wrong
        tabverse is not recoverable from here. Archived rows are included
        (ADR 0011 retires a row from the default views, it does not free it).

        A write, so it is refused while an operator is looking through somebody
        else's account (ADR 0014), and recorded in the audit log as
        `tabspace_deleted`.
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string }
          description: must equal `tabspace_id`
      responses:
        '204': { description: deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: read only while looking through another account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/records:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: Raw record browser
      description: |
        The escape hatch for a record the rendered views cannot make sense of:
        any entity, optionally one tabverse, with a literal substring search
        over the payload (`%` is not a wildcard) and tombstones hidden by
        default.
      parameters:
        - { name: entity, in: query, schema: { $ref: '#/components/schemas/Entity' } }
        - { name: tabspace_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: deleted, in: query, schema: { type: string, enum: ['0', '1'] } }
        - { name: archived, in: query, schema: { type: string, enum: ['0', '1'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: a page of records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/Record' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{user_id}/search:
    parameters: [{ $ref: '#/components/parameters/userId' }]
    get:
      tags: [admin]
      summary: Full text search over one account, with display titles
      description: |
        The same FTS index the extension queries, scoped to one account, with
        the record's title filled in so hits can be listed. An empty `q` is an
        empty result, not "everything". Archived records are hidden unless
        `archived=1`, so this view agrees with the listings beside it; the
        extension's own search never filters them (ADR 0011).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: entity, in: query, schema: { $ref: '#/components/schemas/Entity' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: archived, in: query, schema: { type: string, enum: ['0', '1'] } }
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  hits:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSearchHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A **device token** - the extension's credential, issued by pairing. It is
        not accepted on the console routes, which use a session cookie instead.

  parameters:
    entity:
      name: entity
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Entity' }
    userId:
      name: user_id
      in: path
      required: true
      schema: { type: string }
      description: the account the admin acts on

  schemas:
    Entity:
      type: string
      description: >-
        `session` is deprecated: the extension stopped recording browser
        session snapshots (ADR 0006) and no current client sends it. The server
        still accepts and prunes it for older builds.
      enum:
        [
          tabspace,
          tab,
          session,
          note,
          todo,
          bookmark,
          closedtab,
          allnote,
          alltodo,
          allbookmark,
        ]

    RecordInput:
      type: object
      required: [entity, id, updated_at]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        id: { type: string, maxLength: 128 }
        updated_at:
          type: integer
          description: client assigned modification time (unix ms), used for LWW
        deleted: { type: boolean, default: false }
        payload:
          type: string
          maxLength: 1048576
          description: JSON document shape of the entity

    Record:
      allOf:
        - $ref: '#/components/schemas/RecordInput'
        - type: object
          required: [rev, server_at]
          properties:
            rev: { type: integer, description: server assigned revision }
            server_at:
              {
                type: integer,
                description: when the server accepted it (unix ms),
              }
            device_id: { type: string }

    RecordResult:
      type: object
      required: [entity, id, status, rev, updated_at]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        id: { type: string }
        status: { type: string, enum: [ok, stale] }
        rev: { type: integer }
        updated_at: { type: integer }
        current:
          allOf: [{ $ref: '#/components/schemas/Record' }]
          description: present when status=stale, the winning server copy

    DeviceCredentials:
      type: object
      required: [user_id, device_id, token, server_rev]
      properties:
        user_id: { type: string }
        device_id: { type: string }
        token: { type: string, description: store this, shown only once }
        server_rev: { type: integer }
        issued_at: { type: integer }

    SearchHit:
      type: object
      required: [entity, id, score]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        id: { type: string, description: the id of the record that matched }
        score: { type: number, description: higher is better }
        snippet:
          type: string
          description: >-
            highlighted excerpt, `[term]` marked. Identifier fields (ids,
            tabSpaceId, the aggregate id lists) are not indexed, so they never
            appear here.
        tabspace_id:
          type: string
          description: >-
            the tabverse this record belongs to; for a `tabspace` hit it is the
            record's own id. Absent only for a malformed record payload.
          example: ts-1a2b3c

    ArchiveOutcome:
      type: object
      description: what an archive or unarchive changed
      required: [archived, unarchived, skipped]
      properties:
        archived: { type: integer, description: rows hidden from the default views }
        unarchived: { type: integer }
        skipped:
          type: integer
          description: rows already in the requested state, so a repeated call is a visible no-op

    UserSummary:
      type: object
      required: [id, name, email, role, created_at, rev_seq, device_count, token_count, record_count]
      properties:
        id: { type: string }
        name: { type: string }
        email:
          type: string
          description: |
            The address this account signs in with. It is what the directory is
            read by - a row without it is an opaque id - and the only way an
            account can have been proven (ADR 0014).
        role:
          type: string
          enum: [user, admin]
          description: '`admin` may see and act on every account; `user` only on their own.' 
        created_at: { type: string, format: date-time }
        rev_seq: { type: integer, description: the account's current revision tip }
        device_count: { type: integer }
        token_count: { type: integer, description: tokens that are not revoked }
        revoked_token_count: { type: integer }
        record_count: { type: integer, description: live records, tombstones excluded }
        last_activity:
          type: integer
          description: newest updated_at among live records, 0 if never synced

    TokenInfo:
      type: object
      required: [hash, fingerprint, device_id, created_at, revoked]
      properties:
        hash: { type: string, description: the stored hash; pass it to revoke this token }
        fingerprint: { type: string, description: first 8 characters, for display }
        device_id: { type: string }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
        revoked: { type: boolean }
        last_used: { type: integer, description: unix ms of the last authenticated request, 0 if never }
        archived_at: { type: integer, description: 0 when not archived (ADR 0011) }
        archived: { type: boolean }

    DeviceInfo:
      type: object
      required: [id, name, created_at, active_tokens]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        active_tokens: { type: integer }
        last_used: { type: integer }
        archived_at: { type: integer, description: 0 when not archived (ADR 0011) }
        archived: { type: boolean }
        archived_records: { type: integer, description: live records this device wrote that are archived }

    TabspaceSummary:
      type: object
      required: [id, name, updated_at, rev, tab_count]
      properties:
        id: { type: string }
        name:
          type: string
          description: "(untitled) when the stored payload has no name"
        created_at: { type: integer }
        updated_at: { type: integer }
        rev: { type: integer }
        tab_count: { type: integer, description: "len(tabIds) of the stored payload" }
        groups: { type: integer, description: tab groups the tabverse remembers }
        notes: { type: integer }
        todos: { type: integer }
        bookmarks: { type: integer }
        closed_tabs: { type: integer }

    BundleRow:
      type: object
      required: [id, rev, updated_at, position, data]
      properties:
        id: { type: string }
        rev: { type: integer }
        updated_at: { type: integer }
        server_at: { type: integer }
        position: { type: integer, description: index in the client's own ordering }
        data: { type: object, description: the record payload, decoded }

    TabspaceBundle:
      type: object
      required: [tabspace, tabs, notes, todos, bookmarks, closed_tabs, aggregates]
      properties:
        tabspace: { $ref: '#/components/schemas/TabspaceSummary' }
        tabspace_data:
          type: object
          description: the tabverse's own payload, decoded (tab groups live here)
        tabs:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        todos:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        bookmarks:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        closed_tabs:
          type: array
          items: { $ref: '#/components/schemas/BundleRow' }
        aggregates:
          type: object
          description: the raw allnote / alltodo / allbookmark payloads
          additionalProperties: { type: string }

    AdminSearchHit:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            title: { type: string, description: the record's display title, for listing }
            url: { type: string }

    Totals:
      type: object
      required: [users, devices, active_tokens, live_records, tombstones]
      properties:
        users: { type: integer }
        devices: { type: integer }
        active_tokens: { type: integer }
        live_records: { type: integer }
        tombstones: { type: integer }
        archived_devices: { type: integer }
        archived_tokens: { type: integer }
        archived_records:
          type: integer
          description: still counted in live_records; archiving hides a row from the console, it does not unstore it
        by_entity:
          type: object
          additionalProperties: { type: integer }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing or invalid token / invite code
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: account already bootstrapped
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: unknown entity, record or account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminDisabled:
      description: TABVERSED_ADMIN_TOKEN is not set, so the admin API does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: batch or payload too large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SyncResult:
      description: sync outcome
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items: { $ref: '#/components/schemas/RecordResult' }
              server_rev: { type: integer }

security:
  - bearerToken: []
