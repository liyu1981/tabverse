# The website is its own pnpm workspace root so that it keeps a lockfile of its
# own, separate from the extension at the repository root.
allowBuilds:
  '@parcel/watcher': true
  core-js: true

# Patched versions of transitive build-tool dependencies (dependabot alerts
# against the site's lockfile; pnpm 12 reads these settings here, not from
# package.json's "pnpm" field).
overrides:
  serialize-javascript: ^7.1.3
  tinypool: ^2.1.2
  uuid: ^11.1.1
