name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Chrome extension: format, lint, test, production bundle ----
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup picks the version up from packageManager in
      # package.json, so the lockfile and CI cannot drift apart
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # TypeScript 6 / Vite 8 want a recent node; 22 is the active LTS
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: format check
        run: pnpm run format:check

      - name: lint
        run: pnpm run lint:check

      - name: unit tests
        run: pnpm test

      - name: production build
        run: pnpm run build

      - name: archive production bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 7

  # ---- tabversed sync server: console build, vet, race tests, cross ----
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # the server build/test/cross targets are package.json scripts (no
      # Makefile). The console build (adr/0018) needs the workspace's
      # node_modules, so this job installs them like the extension job does.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The console is a Vite app embedded in the binary (adr/0018), so the Go
      # targets below need its build output: `go:embed` has nothing to embed
      # otherwise, and internal/webui's tests fail with the command to run.
      # Both steps run at the repository root - this job's default working
      # directory is server/, where there is no package.json.
      - name: install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: build the console
        run: pnpm run ui:build
        working-directory: .

      # What sits outside /console (adr/0024): nothing in this flavour, so the
      # tracked redirect page is what answers "/". The step still runs because
      # it is the same script the official flavour uses, and it is what clears
      # a stale docs/ tree - there is none on a fresh checkout.
      - name: prepare the embedded site
        run: pnpm run site:prepare
        working-directory: .

      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: server

      - name: go vet
        run: go vet ./...
        working-directory: server

      - name: unit tests (with race detector)
        run: go test -race ./...
        working-directory: server

      - name: cross compile (pure go, no cgo)
        run: pnpm run server:cross
        working-directory: .

      - name: archive server binaries
        uses: actions/upload-artifact@v4
        with:
          name: tabversed-binaries
          path: server/dist/
          retention-days: 7

  # ---- tabversed, official flavour: the documentation is in the binary ----
  #
  # The same binary with `officialserver=1` (adr/0024): the docs are built into
  # the embed, so "/" is the documentation instead of a page that redirects to
  # the console. This job exists so that flavour cannot rot - it is the one a
  # deployment serving the docs gets, and nothing else builds it.
  server-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: pnpm/action-setup@v4

      # Two lockfiles: the workspace's for the console, and the website's own
      # workspace for the docs - they are separate installs by design.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            doc/tabverse-website/pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: install the website's dependencies
        run: pnpm install --frozen-lockfile
        working-directory: doc/tabverse-website

      - name: build the console
        run: pnpm run ui:build

      - name: build the docs into the embed
        run: officialserver=1 pnpm run site:prepare

      # `go test` skips its embedded-docs test when they are absent, so the
      # thing this job is here for has to be checked out of band: a build that
      # quietly produced no documentation would otherwise pass.
      - name: the documentation really is there
        run: test -f server/internal/webui/docs/index.html

      - name: go vet
        run: go vet ./...
        working-directory: server

      - name: unit tests (with race detector)
        run: go test -race ./...
        working-directory: server

  # ---- store package: zip that can be uploaded to the web store ----
  package:
    runs-on: ubuntu-latest
    needs: [extension, server, server-official]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build store zip
        # produces dist_crx/tabverse.zip; .crx signing is intentionally not
        # done here (the web store takes a zip, keys stay local)
        run: pnpm run build-crx

      - name: archive store package
        uses: actions/upload-artifact@v4
        with:
          name: tabverse-store-zip
          path: dist_crx/tabverse.zip
          retention-days: 14
