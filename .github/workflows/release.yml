name: Release

# A release is a tag (adr/0034): pushing `v0.7.3` runs this workflow, which
# gates on the checks CI runs, attaches the store package to a GitHub release,
# and then submits that package to the Chrome Web Store and asks for a review.
# The version is nowhere written down here: it is the tag, and the tag has to
# agree with package.json and src/global.ts before anything is built.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (leave empty to rehearse the current branch - dry run only)
        required: false
      dry_run:
        description: Build and check only - release nothing, submit nothing
        type: boolean
        default: false

# One release at a time. Re-running is a supported way to retry the store step
# (the release is then updated in place), so a second run waits rather than
# cancelling the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # create the GitHub release and upload the zip to it
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A dispatched run for an existing tag releases *that tag's* tree; a
      # dispatched run with no tag rehearses the commit it was started from,
      # which is the only way to rehearse code that has not been tagged yet.
      # (A tag push dispatches nothing: github.sha is that tag's commit.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: the version
        id: version
        env:
          # a tag push names the release; a dispatched run names it explicitly
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # One version, three places: the tag names it, package.json is what
          # the manifest is built from, and src/global.ts is what the About
          # panel shows. A release that is labelled 0.7.3 while its UI says
          # 0.7.2 is a bug nobody notices until a user reports it.
          package=$(node -p "require('./package.json').version")
          ui=$(node -p "require('fs').readFileSync('src/global.ts', 'utf8').match(/TABSPACE_VERSION = 'v([^']+)'/)[1]")
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error::tag '$TAG' is not v<version>, for example v0.7.3"
              exit 1
            fi
          else
            # no tag: a rehearsal of this commit, never a release
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::a release needs a tag: push v<version>, or dispatch with tag=v<version>"
              exit 1
            fi
            version="$package"
            echo "::notice::rehearsing $version from commit $GITHUB_SHA - no tag, nothing will be released"
          fi
          if [ "$version" != "$package" ] || [ "$version" != "$ui" ]; then
            echo "::error::the version is $version, package.json says $package and src/global.ts says v$ui: run 'node tools/version_update $version', commit, and tag that commit"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $version${TAG:+ from tag $TAG}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # The same gates as ci.yml. A tag can be pushed from a commit that never
      # went through a pull request, so the release cannot assume they passed.
      - name: typecheck
        run: pnpm run typecheck

      - name: format check
        run: pnpm run format:check

      - name: lint
        run: pnpm run lint:check

      - name: unit tests
        run: pnpm test

      - name: build the store package
        run: pnpm run build-store

      - name: archive the store package
        uses: actions/upload-artifact@v4
        with:
          name: tabverse-store-zip
          path: dist_store/tabverse.zip
          retention-days: 14

      # Everything after this point is a release. The GitHub release is created
      # *before* the store submission on purpose: it is the step that can be
      # retried, so a store failure never leaves a tag without its download
      # (adr/0034).
      - name: attach the package to the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # release assets have always carried the version: tabverse_v0.7.2.zip
          asset="dist_store/tabverse_v${VERSION}.zip"
          cp dist_store/tabverse.zip "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run: replace the asset instead of adding a second copy
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --title "Tabverse v${VERSION}" \
              --generate-notes
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # The one irreversible step: a version number cannot be uploaded twice,
      # so tools/cwsUpload.mjs checks the archive and the store's current
      # version first and fails before uploading if either says no.
      - name: submit to the Chrome Web Store
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # a fork has no store credentials and no store to submit to: it still
          # validates the package, which is what a dry run is for
          DRY_RUN: ${{ inputs.dry_run || secrets.CWS_REFRESH_TOKEN == '' }}
          # all four credentials are secrets, deliberately: one place to look,
          # and one place to rotate. The publisher id is not sensitive (the
          # dashboard shows it), but splitting it out to a variable only
          # created a way to configure it somewhere the workflow cannot read.
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          # the extension id is public, so it is an overridable default rather
          # than a secret a fork has to invent
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID || 'lffblcippngalmglinedcbmikkncihdm' }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          args=(--source dist_store/tabverse.zip --expect-version "$VERSION" --publish)
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run or no store credentials: the package is validated, not submitted"
            args+=(--dry-run)
          fi
          node tools/cwsUpload.mjs "${args[@]}"

      - name: summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || secrets.CWS_REFRESH_TOKEN == '' }}
        run: |
          set -euo pipefail
          {
            echo "### Tabverse ${VERSION}"
            if [ "$DRY_RUN" = "true" ]; then
              echo
              echo "Dry run: the package was built, checked and archived; nothing was released."
            else
              echo
              echo "- GitHub release: https://github.com/$GITHUB_REPOSITORY/releases/tag/${TAG}"
              echo "- Chrome Web Store: submitted for review; approval is not instant"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
